/* 调试：把运行时错误直接显示在页面顶部 */
window.addEventListener('error',function(e){
  var d=document.getElementById('nogl');
  if(!d)return;
  d.style.cssText='display:block;position:fixed;top:0;left:0;right:0;background:#7A1F2B;color:#fff;padding:10px 14px;font-size:13px;z-index:999;max-height:45%;overflow:auto;font-family:monospace';
  d.textContent='⚠ '+(e.message||'unknown error')+'  @ line '+(e.lineno||'?');
});
window.addEventListener('unhandledrejection',function(e){
  var d=document.getElementById('nogl');
  if(!d)return;
  d.style.cssText='display:block;position:fixed;top:0;left:0;right:0;background:#7A1F2B;color:#fff;padding:10px 14px;font-size:13px;z-index:999;max-height:45%;overflow:auto;font-family:monospace';
  d.textContent='⚠ Promise: '+(e.reason&&e.reason.message?e.reason.message:String(e.reason));
});
/* ==================================================================
 *  今夜小厨 v0.2 —— Phaser 3 游戏版
 *  结构：CORE（纯逻辑，无 DOM 依赖，可独立测试）/ ART / SFX / 场景
 * ================================================================== */

/* ======================= CORE BEGIN ======================= */
const INGS = {
  carrot:   {n:'胡萝卜'},
  egg:      {n:'鸡蛋'},
  fish:     {n:'鱼'},
  rice:     {n:'米饭'},
  mushroom: {n:'蘑菇'},
};
const ING_IDS = Object.keys(INGS);

const RECIPES = [
  {n:'黄金蛋炒饭', p:1, needs:['egg','rice']},
  {n:'奶油蘑菇汤', p:1, needs:['mushroom','carrot']},

  {n:'太阳蛋沙拉', p:1, needs:['egg','carrot']},
  {n:'鱼香拌饭',   p:1, needs:['fish','rice']},
  {n:'蘑菇焖饭',   p:1, needs:['mushroom','rice']},
  {n:'鱼子蒸蛋',   p:1, needs:['fish','egg']},
  {n:'萝卜鱼汤',   p:1, needs:['carrot','fish']},
  {n:'山珍煎蛋饼',   p:2, needs:['carrot','egg','mushroom']},
  {n:'渔家玉子烧',   p:2, needs:['carrot','egg','fish']},
  {n:'彩虹拌饭',     p:2, needs:['carrot','egg','rice']},
  {n:'森林炖鱼',     p:2, needs:['carrot','fish','mushroom']},
  {n:'暖心鱼汤泡饭', p:2, needs:['carrot','fish','rice']},
  {n:'陶锅蘑菇饭',   p:2, needs:['carrot','mushroom','rice']},
  {n:'云朵蘑菇蒸蛋', p:2, needs:['egg','fish','mushroom']},
  {n:'江户前蛋盖饭', p:2, needs:['egg','fish','rice']},
  {n:'蛋香蘑菇炊饭', p:2, needs:['egg','mushroom','rice']},
  {n:'深山渔夫饭',   p:2, needs:['fish','mushroom','rice']},
  {n:'湖畔全宴',       p:3, needs:['carrot','egg','fish','mushroom']},
  {n:'清晨渔市定食',   p:3, needs:['carrot','egg','fish','rice']},
  {n:'森林早餐拼盘',   p:3, needs:['carrot','egg','mushroom','rice']},
  {n:'山海盛宴',       p:3, needs:['carrot','fish','mushroom','rice']},
  {n:'灯塔晚餐',       p:3, needs:['egg','fish','mushroom','rice']},
  {n:'打烊前最后一宴', p:3, needs:['carrot','egg','fish','mushroom','rice']},
];

const REGULARS = [
  {n:'流浪猫·豆浆', e:'rCat',     likes:'fish',    line:'喵……闻到鱼味就走不动道了'},
  {n:'柴犬·阿福',   e:'rDog',     likes:'egg',     line:'旺！金黄的太阳蛋最棒了！'},
  {n:'小狐狸·团子', e:'rFox',     likes:'mushroom',line:'嘿嘿，山里刚采的蘑菇最香'},
  {n:'刺猬·球球',   e:'rHedgehog',likes:'carrot',  line:'咔嚓咔嚓，脆脆的像小零食'},
  {n:'仓鼠·金金',   e:'rHamster', likes:'rice',    line:'圆滚滚的米饭，要塞满腮帮子'},
  {n:'浣熊·阿茶',   e:'rRaccoon', likes:'fish',    line:'洗洗干净再吃，这是讲究~'},
];

const HAND_LIMIT = 6;
const WIN_DISHES = 5;

let G = null;
let lastSettings = {mode:'pvp', n1:'猫厨·馒头', n2:'兔厨·花卷'};

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function mkPlayer(name,emoji){return {name,emoji,hand:[],tips:3,favors:0,dishes:[],usedRefresh:false,usedSwap:false};}
function cur(){return G.players[G.current];}
function opp(){return G.players[1-G.current];}
function cnt(p,id){return p.hand.filter(x=>x===id).length;}
function canCook(p,r){return r.needs.every(id=>cnt(p,id)>=1);}
function dishPts(p){return p.dishes.reduce((s,d)=>s+d.p,0);}
function sigCount(p){return p.dishes.filter(d=>d.sig).length;}
function totalScore(p){return dishPts(p)+sigCount(p)*2+Math.floor(p.tips/2);}
function logAdd(t,cls){G.log.push({t,cls:cls||''});if(G.log.length>80)G.log.shift();}
function emit(type,data){G.events.push(Object.assign({type:type},data||{}));if(G.events.length>200)G.events.shift();}

function newGame(mode,n1,n2){
  lastSettings={mode:mode,n1:n1,n2:n2};
  const deck=shuffle([].concat(...ING_IDS.map(id=>Array(10).fill(id))));
  const rd=shuffle(RECIPES.map((r,i)=>Object.assign({},r,{uid:i})));
  const players=[mkPlayer(n1,'catChef'),mkPlayer(n2,mode==='ai'?'owlChef':'rabbitChef')];
  players.forEach(p=>{p.hand=deck.splice(0,2);});
  const regularDeck=shuffle(REGULARS.slice());
  G={mode:mode,deck:deck,discard:[],market:deck.splice(0,4),
     recipeDeck:rd,wall:rd.splice(0,4),
     regularDeck:regularDeck,regular:regularDeck.pop(),
     players:players,current:Math.floor(Math.random()*2),
     turnCounts:[0,0],closing:false,over:false,turn:1,
     log:[],events:[],
     ui:{mode:'idle',sel:new Set(),gather:{active:false,wantExtra:false},lock:false}};
  logAdd('🌙 夜市开张！打烊前，比谁做出的菜更好吃～','sys');
  logAdd(`今晚的常客是 ${G.regular.n}（最爱${INGS[G.regular.likes].n}）`,'sys');
  logAdd(`掷硬币：${cur().name} 先行动`,'sys');
  emit('start',{first:G.current});
  if(G.mode==='ai'&&G.current===1){G.ui.lock=true;emit('pass',{player:1,ai:true});}
  else if(G.mode==='pvp'){emit('pass',{player:G.current,ai:false});}
}

function drawIng(k){
  const out=[];
  for(let i=0;i<k;i++){
    if(!G.deck.length){
      if(!G.discard.length)break;
      G.deck=shuffle(G.discard);G.discard=[];
      logAdd('♻️ 食材堆用完了，弃牌堆洗回牌堆');
    }
    out.push(G.deck.pop());
  }
  return out;
}

/* ---------- 行动 ---------- */
function startGather(){G.ui.gather={active:true,wantExtra:false};}
function toggleExtra(){
  const p=cur();
  if(p.tips<1)return 'NO_TIP';
  if(p.hand.length+2>HAND_LIMIT)return 'NO_ROOM';
  G.ui.gather.wantExtra=!G.ui.gather.wantExtra;
  return 'OK';
}
function cancelGather(){G.ui.gather={active:false,wantExtra:false};}
function takeMarket(idx){
  const p=cur();
  if(p.hand.length>=HAND_LIMIT)return 'FULL';
  const card=G.market.splice(idx,1)[0];
  p.hand.push(card);
  G.market.splice(idx,0,...drawIng(1));
  logAdd(`${p.name} 从市场拿走了 ${INGS[card].n}`);
  emit('gather',{player:G.current,ing:card});
  if(G.ui.gather.wantExtra&&p.tips>=1&&p.hand.length<HAND_LIMIT){
    p.tips--;G.ui.gather.wantExtra=false;
    return 'EXTRA';       // 继续拿第二张
  }
  G.ui.gather={active:false,wantExtra:false};
  afterAction();
  return 'DONE';
}

function cook(wallIdx,sig){
  const p=cur();const r=G.wall[wallIdx];
  if(!r||!canCook(p,r))return 'NO';
  r.needs.forEach(id=>{p.hand.splice(p.hand.indexOf(id),1);});
  G.discard.push(...r.needs);
  G.wall.splice(wallIdx,1);
  const nr=G.recipeDeck.pop();if(nr)G.wall.push(nr);
  const dish=Object.assign({},r,{sig:false});
  p.dishes.push(dish);
  p.tips+=r.p;
  logAdd(`${p.name} 做出了「${r.n}」＋${r.p}分，收小费 ${r.p} 枚`);
  let favor=false;
  if(r.needs.includes(G.regular.likes)){
    p.favors++;favor=true;
    logAdd(`${G.regular.n} 吃得很满意 → ${p.name} 获得青睐（${p.favors}）`);
  }
  let usedSig=false;
  if(sig&&p.favors>=2){
    p.favors-=2;dish.sig=true;usedSig=true;
    logAdd(`「${r.n}」挂上了金灿灿的招牌牌 ✨＋2分`);
  }
  emit('cook',{player:G.current,dish:dish,favor:favor,sig:usedSig});
  afterAction();
  return 'DONE';
}

function startPrep(){G.ui.mode='prep';G.ui.sel=new Set();}
function toggleSel(i){
  if(G.ui.sel.has(i))G.ui.sel.delete(i);else G.ui.sel.add(i);
}
function confirmPrep(selArr){
  const p=cur();
  let sel=selArr||[...G.ui.sel];
  if(sel.length===0)return 'EMPTY';
  sel=sel.slice().sort((a,b)=>b-a);
  const discarded=sel.map(i=>p.hand.splice(i,1)[0]);
  G.discard.push(...discarded);
  const room=HAND_LIMIT-p.hand.length;
  const drawn=drawIng(Math.min(discarded.length+1,room));
  p.hand.push(...drawn);
  p.tips+=1;
  logAdd(`${p.name} 备菜整理：弃 ${discarded.length} 张，抽 ${drawn.length} 张，＋1 小费`);
  emit('prep',{player:G.current,ndisc:discarded.length,ndraw:drawn.length});
  G.ui.mode='idle';G.ui.sel=new Set();
  afterAction();
  return 'DONE';
}
function cancelPrep(){G.ui.mode='idle';G.ui.sel=new Set();}

function refreshMarket(){
  const p=cur();
  if(p.usedRefresh)return 'USED';
  if(p.tips<2)return 'NO_TIP';
  p.tips-=2;p.usedRefresh=true;
  G.discard.push(...G.market);
  G.market=drawIng(4);
  logAdd(`${p.name} 花 2 小费把市场翻新了个遍`);
  emit('refresh',{player:G.current});
  return 'DONE';
}
function startSwap(){
  const p=cur();
  if(p.usedSwap)return 'USED';
  if(p.tips<3)return 'NO_TIP';
  if(!G.recipeDeck.length)return 'NO_DECK';
  G.ui.mode='swap';
  return 'OK';
}
function doSwap(wallIdx){
  const p=cur();
  if(!G.wall[wallIdx])return 'NO';
  p.tips-=3;p.usedSwap=true;
  const r=G.wall.splice(wallIdx,1)[0];
  G.recipeDeck.unshift(r);
  const nr=G.recipeDeck.pop();if(nr)G.wall.push(nr);
  logAdd(`${p.name} 花 3 小费把「${r.n}」撤下菜单，换了张新的`);
  emit('swap',{player:G.current,old:r.n});
  G.ui.mode='idle';
  return 'DONE';
}
function cancelSwap(){G.ui.mode='idle';}

/* ---------- 回合流转 ---------- */
function afterAction(){
  const p=cur();
  G.turnCounts[G.current]++;
  if(!G.closing&&p.dishes.length>=WIN_DISHES){
    G.closing=true;
    logAdd(`🔔 ${p.name} 完成第 ${WIN_DISHES} 道菜！打烊铃响——最后行动`,'sys');
    emit('closing',{player:G.current});
  }
  if(G.closing&&G.turnCounts[0]===G.turnCounts[1]){finishGame();return;}
  G.current=1-G.current;G.turn++;
  cur().usedRefresh=false;cur().usedSwap=false;
  G.ui.mode='idle';G.ui.sel=new Set();G.ui.gather={active:false,wantExtra:false};
  const isAI=(G.mode==='ai'&&G.current===1);
  G.ui.lock=isAI;
  emit('pass',{player:G.current,ai:isAI});
}

function finishGame(){
  G.over=true;
  const [a,b]=G.players;
  const sa=totalScore(a),sb=totalScore(b);
  if(sa>sb)logAdd(`🏆 ${a.name} 以 ${sa}:${sb} 赢下今晚！`,'sys');
  else if(sb>sa)logAdd(`🏆 ${b.name} 以 ${sb}:${sa} 赢下今晚！`,'sys');
  else logAdd(`🤝 ${sa}:${sb} 平分秋色——今夜双厨！`,'sys');
  G.ui.lock=true;
  emit('over',{sa:sa,sb:sb});
}

/* ---------- AI ---------- */
function aiCardScore(p,id){
  let s=0;
  G.wall.forEach(r=>{
    const missing=r.needs.filter(n=>cnt(p,n)===0);
    if(missing.includes(id)&&missing.length<=3)s+=r.p/missing.length;
  });
  if(id===G.regular.likes)s+=0.15;
  return s;
}
function aiTurn(){
  if(!G||G.over)return 'SKIP';
  const p=cur();const fav=G.regular.likes;
  let best=-1,bestScore=-1;
  G.wall.forEach((r,i)=>{
    if(canCook(p,r)){
      const s=r.p+(r.needs.includes(fav)?0.6:0);
      if(s>bestScore){bestScore=s;best=i;}
    }
  });
  if(best>=0){cook(best,p.favors>=2);return 'DONE';}
  if(p.hand.length<HAND_LIMIT&&G.market.length){
    let bi=0,bs=-1;
    G.market.forEach((id,i)=>{const s=aiCardScore(p,id);if(s>bs){bs=s;bi=i;}});
    startGather();return takeMarket(bi);
  }
  const sel=[];
  p.hand.forEach((id,i)=>{if(aiCardScore(p,id)===0)sel.push(i);});
  if(sel.length===0&&p.hand.length)sel.push(0);
  if(!sel.length)return 'STUCK';
  return confirmPrep(sel);
}
/* ======================= CORE END ======================= */

function svgToCanvas(svg,w,h){
  return new Promise(res=>{
    const img=new Image();
    img.onload=()=>{const c=document.createElement('canvas');c.width=w;c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);res(c);};
    img.onerror=()=>res(null);
    img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
  });
}

/* 夜市背景（canvas 手绘：星空 + 屋顶 + 灯笼串 + 木桌） */
function makeBgCanvas(){
  const W=1280,H=800;
  const c=document.createElement('canvas');c.width=W;c.height=H;
  const x=c.getContext('2d');
  // 夜空渐变
  const sky=x.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#272C4E');sky.addColorStop(.6,'#3E4378');sky.addColorStop(1,'#4A4E8C');
  x.fillStyle=sky;x.fillRect(0,0,W,H);
  // 星星
  let seed=42;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647;};
  x.fillStyle='#FFF6E4';
  for(let i=0;i<90;i++){
    const sx=rnd()*W,sy=rnd()*H*.55,r=rnd()*1.8+.4;
    x.globalAlpha=.25+rnd()*.65;x.beginPath();x.arc(sx,sy,r,0,7);x.fill();
  }
  x.globalAlpha=1;
  // 月亮
  const mg=x.createRadialGradient(1120,120,10,1120,120,150);
  mg.addColorStop(0,'rgba(255,240,200,.9)');mg.addColorStop(1,'rgba(255,240,200,0)');
  x.fillStyle=mg;x.fillRect(970,-30,300,300);
  x.fillStyle='#FFF3CF';x.beginPath();x.arc(1120,120,52,0,7);x.fill();
  x.fillStyle='#F3E2AF';x.beginPath();x.arc(1104,108,10,0,7);x.arc(1136,132,7,0,7);x.fill();
  // 远处屋顶剪影
  x.fillStyle='#222745';
  x.beginPath();x.moveTo(0,300);
  const roofs=[[0,300,140,60],[140,300,120,110],[260,300,160,50],[420,300,130,90],[550,300,150,60],[700,300,120,120],[820,300,170,55],[990,300,130,100],[1120,300,160,60]];
  roofs.forEach(r=>{x.lineTo(r[0],r[1]-rnd()*30);x.lineTo(r[0]+r[2]/2,r[1]-r[3]);x.lineTo(r[0]+r[2],r[1]);});
  x.lineTo(W,300);x.lineTo(W,H);x.lineTo(0,H);x.closePath();x.fill();
  // 亮着的小窗
  x.fillStyle='rgba(255,214,138,.85)';
  [[190,255],[300,225],[470,240],[730,215],[1035,235],[1180,255],[590,250]].forEach(w=>{x.fillRect(w[0],w[1],10,13);});
  // 灯笼串
  x.strokeStyle='rgba(90,60,40,.9)';x.lineWidth=3;
  x.beginPath();x.moveTo(-10,60);x.quadraticCurveTo(W/2,150,W+10,60);x.stroke();
  for(let i=1;i<=8;i++){
    const t=i/9;
    const lx=-10+(W+20)*t;
    const ly=60+ (150-(-90)*t*(1-t)*4/2.2)*0 + (4*90*t*(1-t))*1.0; // 抛物线
    const hang=34+((i%2)?16:0);
    x.strokeStyle='rgba(90,60,40,.9)';x.lineWidth=2.5;
    x.beginPath();x.moveTo(lx,ly);x.lineTo(lx,ly+hang);x.stroke();
    const g=x.createRadialGradient(lx,ly+hang+18,4,lx,ly+hang+18,60);
    g.addColorStop(0,'rgba(255,190,110,.55)');g.addColorStop(1,'rgba(255,190,110,0)');
    x.fillStyle=g;x.fillRect(lx-60,ly+hang-42,120,120);
    x.fillStyle=i%2?'#E8875C':'#E85D4A';
    x.beginPath();x.ellipse(lx,ly+hang+16,17,20,0,0,7);x.fill();
    x.fillStyle='rgba(255,240,190,.95)';x.fillRect(lx-2,ly+hang,4,34);
  }
  // 木桌
  const woodY=560;
  const wg=x.createLinearGradient(0,woodY,0,H);
  wg.addColorStop(0,'#9A6644');wg.addColorStop(1,'#7C4F33');
  x.fillStyle=wg;x.fillRect(0,woodY,W,H-woodY);
  x.strokeStyle='rgba(60,35,20,.35)';x.lineWidth=3;
  [620,680,740].forEach(y=>{x.beginPath();x.moveTo(0,y);x.lineTo(W,y);x.stroke();});
  x.fillStyle='rgba(60,35,20,.18)';
  for(let i=0;i<14;i++){x.fillRect(60+((i*173)%(W-80)),woodY+14,4,70);}
  // 桌沿高光
  x.fillStyle='rgba(255,230,190,.25)';x.fillRect(0,woodY,W,6);
  return c;
}

/* ======================= SFX ======================= */
const SFX={
  ctx:null,on:(function(){try{return localStorage.getItem('jyxc_mute')!=='1';}catch(e){return true;}})(),
  ensure(){if(!this.ctx){try{this.ctx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
    if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume();},
  tone(f,dur,type,vol,slide){
    if(!this.on)return;this.ensure();if(!this.ctx)return;
    const t=this.ctx.currentTime;
    const o=this.ctx.createOscillator(),g=this.ctx.createGain();
    o.type=type||'sine';o.frequency.setValueAtTime(f,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);
    g.gain.setValueAtTime(vol||.12,t);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g);g.connect(this.ctx.destination);
    o.start(t);o.stop(t+dur+.02);
  },
  pop(){this.tone(540,.09,'triangle',.15,760);},
  click(){this.tone(320,.06,'square',.05);},
  coin(){this.tone(880,.07,'square',.07);setTimeout(()=>this.tone(1320,.09,'square',.06),60);},
  chime(){[523,659,784].forEach((f,i)=>setTimeout(()=>this.tone(f,.22,'sine',.1),i*80));},
  heart(){this.tone(700,.12,'sine',.09,1000);},
  bell(){this.tone(1568,.5,'sine',.08);setTimeout(()=>this.tone(1046,.6,'sine',.06),120);},
  fanfare(){[523,659,784,1046].forEach((f,i)=>setTimeout(()=>this.tone(f,.3,'triangle',.1),i*110));},
  no(){this.tone(200,.12,'sawtooth',.05,140);},
};

/* ======================= 通用 UI 工具 ======================= */
const FONT='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif';
const C={ink:'#5B4636',sub:'#9C8877',cream:'#FFF6E6',card:'#FFFDF7',line:'#F0DFC8',
  amber:'#F09A4B',amberD:'#D97E2E',green:'#7FB77E',pink:'#F26D85',night:'#2E3557'};

function rr(g,x,y,w,h,r,fill,stroke,lw){
  if(fill){g.fillStyle(fill);g.fillRoundedRect(x,y,w,h,r);}
  if(stroke){g.lineStyle(lw||3,stroke,1);g.strokeRoundedRect(x,y,w,h,r);}
}
function txt(scene,x,y,str,size,color,weight,origin){
  const t=scene.add.text(x,y,str,{fontFamily:FONT,fontSize:size+'px',color:color||C.ink,
    fontStyle:weight||'normal'});
  t.setOrigin(origin===undefined?0.5:origin,0.5);
  return t;
}
function makeBtn(scene,x,y,w,h,label,cb,opt){
  opt=opt||{};
  const ct=scene.add.container(x,y);
  const g=scene.add.graphics();
  rr(g,-w/2,-h/2,w,h,h/2,opt.fill||C.amber,null);
  ct.add(g);
  const t=txt(scene,0,1,label,opt.size||19,'#fff','bold');
  ct.add(t);
  ct.setSize(w,h);
  ct.setInteractive(new Phaser.Geom.Rectangle(-w/2,-h/2,w,h),Phaser.Geom.Rectangle.Contains);
  ct.on('pointerover',()=>{scene.tweens.add({targets:ct,scale:1.05,duration:90});});
  ct.on('pointerout',()=>{scene.tweens.add({targets:ct,scale:1,duration:90});});
  ct.on('pointerdown',()=>{SFX.click();scene.tweens.add({targets:ct,scale:.94,duration:60,
    yoyo:true,onComplete:()=>cb&&cb(ct)});});
  ct.label=t;
  return ct;
}
function cardShadow(scene,ct,w,h,r){
  const g=scene.add.graphics();
  g.fillStyle(0x000000,.14);g.fillRoundedRect(-w/2+3,-h/2+5,w,h,r);
  ct.addAt(g,0);
}

  showHelp(){buildHelpLayer(this);}
}

class GameScene extends Phaser.Scene{
  constructor(){super('game');}
  init(data){

  /* ---- 浮动提示 ---- */
  toast(msg){
    const S=this;
    if(S.toastText)S.toastText.destroy();
    S.toastText=txt(S,640,150,msg,17,'#FFE9C4','bold');
    S.layers.fx.add(S.toastText);
    S.tweens.add({targets:S.toastText,alpha:0,y:132,duration:2200,onComplete:()=>{S.toastText=null;}});
  }
  floatText(x,y,str,color,size){
    const S=this;
    const t=txt(S,x,y,str,size||22,color||'#FFF6E4','bold');
    S.layers.fx.add(t);
    S.tweens.add({targets:t,y:y-56,alpha:0,duration:1100,onComplete:()=>t.destroy()});
  }

  /* ---- 事件泵：按序播放动画 ---- */
  pump(){
    const S=this;
    if(S.animBusy)return;
    const ev=G.events[S.consumed];
    if(!ev){S.syncAll();return;}
    S.consumed++;
    S.animBusy=true;
    const done=()=>{S.animBusy=false;S.pump();};
    switch(ev.type){
      case 'start':SFX.chime();S.syncAll();S.time.delayedCall(500,done);break;
      case 'gather':{
        SFX.pop();
        S.syncAll();
        const src=S.cardPos('market',ev.ing!==undefined?0:0);
        S.floatText(640,470,'＋'+INGS[ev.ing].n,'#B8E3B8',20);
        S.time.delayedCall(500,done);break;}
      case 'cook':{
        SFX.chime();
        S.syncAll();
        const ring=S.add.graphics();
        ring.lineStyle(6,0x7FB77E,1);ring.strokeCircle(640,270,30);
        S.layers.fx.add(ring);
        S.tweens.add({targets:ring,scale:4,alpha:0,duration:600,onComplete:()=>ring.destroy()});
        S.floatText(640,190,ev.dish.n+' ＋'+ev.dish.p+'分','#FFE28A',26);
        if(ev.favor)setTimeout(()=>SFX.heart(),300);
        if(ev.sig)setTimeout(()=>SFX.coin(),450);
        S.time.delayedCall(1000,done);break;}
      case 'prep':SFX.pop();S.syncAll();S.time.delayedCall(350,done);break;
      case 'refresh':SFX.coin();S.syncAll();S.time.delayedCall(400,done);break;
      case 'swap':SFX.pop();S.syncAll();S.time.delayedCall(400,done);break;
      case 'closing':SFX.bell();S.syncAll();S.time.delayedCall(900,done);break;
      case 'pass':{
        SFX.bell();S.syncAll();
        if(ev.ai){S.showAIBubble();S.time.delayedCall(1100,()=>{S.hideAIBubble();S.aiStep();done();});}
        else if(G.mode==='pvp'){S.showPass();/* done 由按钮触发 */}
        else S.time.delayedCall(250,done);
        break;}
      case 'over':S.syncAll();S.time.delayedCall(700,()=>{S.showOver();done();});break;
      default:S.syncAll();done();
    }
  }
  aiStep(){
    const S=this;
    S.time.delayedCall(500,()=>{aiTurn();S.pump();});
  }

  /* ---- 卡片工厂 ---- */
  makeIngCard(id,x,y,clickable,mIdx){
    const S=this;
    const ct=S.add.container(x,y);
    const g=S.add.graphics();
    rr(g,-48,-58,96,116,14,C.card,null);
    rr(g,-48,-58,96,116,14,null,clickable?C.amber:C.line,3);
    ct.add(g);cardShadow(S,ct,96,116,14);
    ct.add(S.add.image(0,-12,id).setDisplaySize(62,62));
    ct.add(txt(S,0,40,INGS[id].n,15,C.sub,'bold'));
    if(clickable){
      ct.setInputCursor('pointer')
        .setInteractive(new Phaser.Geom.Rectangle(-48,-58,96,116),Phaser.Geom.Rectangle.Contains)
        .on('pointerdown',()=>S.onGatherCard(mIdx,ct));
    }
    return ct;
  }
  cardPos(){return {x:640,y:450};}

  /* ---- 交互回调 ---- */
  onGatherCard(idx,ct){
    const S=this;
    const r=takeMarket(idx);
    if(r==='FULL'){SFX.no();S.toast('手牌已满（上限 6 张），先做菜或备菜吧');return;}
    if(r==='EXTRA'){SFX.pop();S.syncAll();return;} // 继续拿第二张
    S.pump();
  }
  onToggleExtra(){
    const S=this;
    const r=toggleExtra();
    if(r==='NO_TIP'){SFX.no();S.toast('小费不够啦（需要 1 枚）');}
    else if(r==='NO_ROOM'){SFX.no();S.toast('手牌快满了，装不下两份');}
    S.syncAll();
  }
  onCookClick(i){
    const S=this,p=cur();
    if(!canCook(p,G.wall[i]))return;
    if(p.favors>=2){S.showSig(i);return;}
    cook(i,false);S.pump();
  }
  onConfirmPrep(){
    const S=this;
    const r=confirmPrep();
    if(r==='EMPTY'){SFX.no();S.toast('至少要弃 1 张（或点取消）');return;}
    S.pump();
  }
  onSwapClick(i){
    const S=this;
    const r=doSwap(i);
    if(r==='DONE')S.pump();else S.syncAll();
  }

    if(sa>sb){title=a.name+' 赢下今晚！';ct.add(S.add.image(640,170,a.emoji).setDisplaySize(150,150));}
    else if(sb>sa){title=b.name+' 赢下今晚！';ct.add(S.add.image(640,170,b.emoji).setDisplaySize(150,150));}
    else{title='今夜双厨！';ct.add(txt(S,640,170,'🤝',96));}
    ct.add(txt(S,640,290,title,40,'#FFF6E4','bold').setShadow(0,3,'#1E2340',6,true,true));
    // 对账面板
    const g=S.add.graphics();rr(g,-400,0,800,300,20,C.card,null);rr(g,-400,0,800,300,20,null,C.line,3);
    ct.add(S.add.container(640,430,[g]));
    const dishInfo=p=>p.dishes.length+' 道'+(sigCount(p)?'（✨×'+sigCount(p)+'）':'');
    const rows=[
      {label:'玩家',fa:a.name,fb:b.name},
      {label:'完成菜肴',fa:dishInfo(a),fb:dishInfo(b)},
      {label:'菜单分',fa:dishPts(a),fb:dishPts(b)},
      {label:'招牌 ×2',fa:sigCount(a)*2,fb:sigCount(b)*2},
      {label:'小费 ÷2',fa:Math.floor(a.tips/2),fb:Math.floor(b.tips/2)},
      {label:'总分',fa:sa,fb:sb},
    ];
    rows.forEach((r,i)=>{
      const y=448+i*44;
      ct.add(txt(S,280,y,r.label,16,C.sub,'bold'));
      ct.add(txt(S,500,y,String(r.fa),16,i===5?C.amberD:C.ink,i===5?'bold':'normal'));
      ct.add(txt(S,780,y,String(r.fb),16,i===5?C.amberD:C.ink,i===5?'bold':'normal'));
      if(i<5){const lg=S.add.graphics();lg.lineStyle(1,0xF0DFC8,1);lg.lineBetween(270,y+20,800,y+20);ct.add(lg);}
    });
    ct.add(makeBtn(S,500,770,200,56,'🔁 再来一局',()=>{
      ct.destroy();S.scene.restart(S.settings);},{size:20}));
    ct.add(makeBtn(S,780,770,200,56,'🏠 回首页',()=>{
      ct.destroy();S.scene.start('menu');},{fill:0x9C8877,size:20}));
  }
  showHelp(){buildHelpLayer(this);}
}

/* ======================= 启动 ======================= */
(async function boot(){
  if(typeof Phaser==='undefined'){
    document.getElementById('nogl').innerHTML='游戏引擎加载失败 😿<br>请检查网络后刷新页面重试。';
    return;
  }
  const PRE={};
  for(const [k,svg] of Object.entries(ART)){
    const c=await svgToCanvas(svg,256,256);
    if(c)PRE[k]=c;
  }
  PRE.bg=makeBgCanvas();
  class Boot extends Phaser.Scene{
    constructor(){super('boot');}
    create(){
      for(const k in PRE)this.textures.addCanvas(k,PRE[k]);
      this.scene.start('menu');
    }
  }
  new Phaser.Game({
    type:Phaser.AUTO,
    parent:'app',
    width:1280,height:800,
    backgroundColor:'#1E2340',
    scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_BOTH},
    dom:{createContainer:true},
    render:{antialias:true,roundPixels:true},
    scene:[Boot,MenuScene,GameScene],
  });
  document.getElementById('nogl').style.display='none';
})();
</script>
</body>
</html>
